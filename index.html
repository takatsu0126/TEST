<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ブラウザで遊べるオセロ" />
    <title>Othello / オセロ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">TABLETOP / 01</p>
          <h1>Othello<span>/</span>オセロ</h1>
        </div>
        <button class="button button-outline" id="new-game" type="button">新しいゲーム</button>
      </header>

      <section class="game-layout" aria-label="オセロゲーム">
        <div class="board-column">
          <div class="turn-line">
            <p id="turn-label">黒の手番</p>
            <span id="move-count">MOVE 01</span>
          </div>
          <div class="board-frame">
            <div class="board" id="board" role="grid" aria-label="オセロ盤"></div>
          </div>
          <div class="board-note">
            <span class="live-dot"></span>
            <span id="status-message">置ける場所を選んでください</span>
          </div>
        </div>

        <aside class="sidebar">
          <div class="score-panel">
            <div class="score-row score-black">
              <div class="player-label"><span class="stone stone-black"></span><span>BLACK</span></div>
              <strong id="black-score">2</strong>
            </div>
            <div class="score-divider"></div>
            <div class="score-row score-white">
              <div class="player-label"><span class="stone stone-white"></span><span>WHITE</span></div>
              <strong id="white-score">2</strong>
            </div>
          </div>

          <div class="info-panel">
            <div class="panel-heading"><span>GAME INFO</span><span class="panel-index">A1</span></div>
            <dl>
              <div><dt>先攻</dt><dd>BLACK</dd></div>
              <div><dt>ルール</dt><dd>標準オセロ</dd></div>
              <div><dt>盤面</dt><dd>8 × 8</dd></div>
            </dl>
          </div>

          <div class="controls">
            <button class="button button-primary" id="pass-turn" type="button">パスする</button>
            <button class="button button-quiet" id="undo-move" type="button">一手戻す</button>
          </div>
          <p class="hint">石を置けるマスには小さなマーカーが表示されます。</p>
        </aside>
      </section>

      <footer class="footer"><span>OTHELLO</span><span>LOCAL TWO PLAYER</span></footer>
    </main>
    <script src="app.js"></script>
  </body>
</html>
